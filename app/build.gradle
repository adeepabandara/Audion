plugins {
    alias(libs.plugins.android.application)
}

// Load local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.audion.psap'
    compileSdk 34

    defaultConfig {
        applicationId "com.audion.psap"
        minSdk 27
        targetSdk 34
        versionCode 2
        versionName "1.0.0-internal"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    signingConfigs {
        release {
            storeFile file(localProperties.getProperty('RELEASE_STORE_FILE') ?: 'audion-release.jks')
            storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD') ?: 'android'
            keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS') ?: 'audion-release'
            keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug builds can use debug signing automatically
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    
    // Unit testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    
    // Android testing
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    def room_version = "2.6.1"

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "com.google.android.material:material:1.9.0"
    implementation "com.airbnb.android:lottie:6.0.0"
    implementation "net.java.dev.jna:jna:5.5.0@aar"
    implementation "com.alphacephei:vosk-android:0.3.32+"  
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation "androidx.core:core-ktx:1.12.0"
    implementation group: 'com.alphacephei', name: 'vosk-android', version: '0.3.32+'
    
    implementation 'com.github.KihonRyuu:TourGuide:v1.0.18-SNAPSHOT'
    
    // GIF support
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'
    
    // ViewPager2 for tabs
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // PDF generation
    implementation 'com.itextpdf:itextg:5.5.10'
    
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

}