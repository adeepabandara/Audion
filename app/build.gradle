plugins {
    alias(libs.plugins.android.application)
}

// Load local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.audion.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.audion.app"
        minSdk 27
        targetSdk 35
        versionCode 3
        versionName "1.0.0-beta.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Optimize native builds
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    signingConfigs {
        release {
            // Require proper signing configuration - no insecure defaults
            def storeFilePath = localProperties.getProperty('RELEASE_STORE_FILE')
            def storePass = localProperties.getProperty('RELEASE_STORE_PASSWORD')
            def alias = localProperties.getProperty('RELEASE_KEY_ALIAS')
            def keyPass = localProperties.getProperty('RELEASE_KEY_PASSWORD')
            
            if (storeFilePath && storePass && alias && keyPass) {
                storeFile file(storeFilePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            } else {
                // For CI/CD or when credentials are not set, skip signing
                // Release builds will fail gracefully
                println "Warning: Release signing credentials not found in local.properties"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug builds can use debug signing automatically
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    
    // Unit testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    
    // Android testing
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    def room_version = "2.6.1"

    // AndroidX Core & UI
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    
    // Room Database
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    
    // Audio & Speech Processing
    implementation "com.alphacephei:vosk-android:0.3.32+"
    implementation "net.java.dev.jna:jna:5.5.0@aar"
    
    // UI Components
    implementation "com.airbnb.android:lottie:6.0.0"
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    implementation 'com.github.KihonRyuu:TourGuide:v1.0.18-SNAPSHOT'
    
    // GIF support
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'
    
    // ViewPager2 for tabs
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // PDF generation
    implementation 'com.itextpdf:itextg:5.5.10'
    
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

}